[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surfacecheck-poc"
version = "1.0.0"
description = "Explicit-target TLS and HTTP security posture checker"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
surfacecheck = "surfacecheck.cli:main"

[tool.setuptools.packages.find]
include = ["surfacecheck*"]
